services:

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-8.18.0}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${KIBANA_PORT}:5601"
    networks:
      - virto
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status"]
      interval: 10s
      timeout: 10s
      retries: 120
