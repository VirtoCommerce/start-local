# Link file, maintained by the scripts: wires the platform to SQL Server.
services:

  vc-platform-web:
    environment:
      - DatabaseProvider=SqlServer
      - ConnectionStrings__VirtoCommerce=Server=vc-db,1433;Database=VirtoCommerce3;User Id=sa;Password=${DB_PASSWORD:?DB_PASSWORD is empty in .env};TrustServerCertificate=True
    depends_on:
      vc-db:
        condition: service_healthy
