# Link file, maintained by the scripts: wires the platform to MySQL.
services:

  vc-platform-web:
    environment:
      - DatabaseProvider=MySql
      - ConnectionStrings__VirtoCommerce=Server=vc-db;Port=3306;Database=VirtoCommerce3;User=root;Password=${DB_PASSWORD:?DB_PASSWORD is empty in .env}
    depends_on:
      vc-db:
        condition: service_healthy
