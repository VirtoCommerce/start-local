services:

  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-8.18.0}
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ES_PORT}:9200"
    networks:
      - virto
    environment:
      - node.name=es
      - cluster.name=elasticsearch
      - cluster.initial_master_nodes=es
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is empty in .env}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      - xpack.ml.use_auto_machine_memory_percent=true
    restart: unless-stopped
    mem_limit: ${ES_MEM_LIMIT:-1g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fs \"http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s\""]
      interval: 10s
      timeout: 10s
      retries: 120

volumes:
  esdata01:
    name: ${VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME}}_esdata01
